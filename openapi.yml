        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/personas/{id}/training/status:
    get:
      tags: [Training]
      summary: Get training status
      operationId: getTrainingStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Training status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingStatusResponse'
        '400':
          description: Missing persona ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Persona not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/personas/{id}/training/upload:
    post:
      tags: [Training]
      summary: Upload training pairs
      operationId: uploadTrainingPairs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
          application/json:
            schema:
              type: object
              properties:
                csv:
                  type: string
                content:
                  type: string
          text/csv:
            schema:
              type: string
      responses:
        '201':
          description: Training pairs uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingUploadResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Persona not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/personas/{id}/training/pairs:
