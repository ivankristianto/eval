          type: string
        model_name:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
        status:
          $ref: '#/components/schemas/ResultStatus'
        execution_time_ms:
          type: number
        input_tokens:
          type: number
        output_tokens:
          type: number
        total_tokens:
          type: number
        accuracy_score:
          type: number
        error_message:
          type: string

    EvaluationResultsResponse:
