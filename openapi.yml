openapi: 3.0.3
info:
  title: eval-ai-models REST API
  version: 0.2.0
  description: API for AI model evaluation, template management, and LLM-as-Judge training.
servers:
  - url: http://127.0.0.1:4321
tags:
  - name: Evaluation
  - name: Models
  - name: Templates
  - name: Personas
  - name: Training
  - name: Bulk
  - name: Playground

paths:
  /api/evaluate:
    post:
      tags: [Evaluation]
      summary: Start model evaluation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [instruction, model_ids, rubric_type]
              properties:
                instruction: { type: string }
                model_ids: { type: array, items: { type: string } }
                rubric_type: { $ref: '#/components/schemas/RubricType' }
                expected_output: { type: string }
                partial_credit_concepts: { type: array, items: { type: string } }
                system_prompt: { type: string }
                temperature: { type: number }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation_id: { type: string }
                  status: { type: string }
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        model_id: { type: string }
                        model_name: { type: string }
                        provider: { type: string }
                        status: { type: string }

  /api/evaluation-status:
    get:
      tags: [Evaluation]
      summary: Get evaluation status
      parameters:
        - { name: evaluation_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation_id: { type: string }
                  overall_status: { type: string }
                  results: { type: array, items: { type: object } }

  /api/results:
    get:
      tags: [Evaluation]
      summary: Get evaluation results
      parameters:
        - { name: evaluation_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation_id: { type: string }
                  results: { type: array, items: { type: object } }

  /api/evaluations:
    get:
      tags: [Evaluation]
      summary: List evaluations
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: template, in: query, schema: { type: string } }
        - { name: rubric, in: query, schema: { $ref: '#/components/schemas/RubricType' } }
      responses:
        '200':
          description: List of evaluations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EvaluationListItem' } }
                  total: { type: number }
                  page: { type: number }
                  pageSize: { type: number }
    delete:
      tags: [Evaluation]
      summary: Bulk delete evaluations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: Deleted count
          content:
            application/json:
              schema: { type: object, properties: { deleted: { type: number } } }

  /api/models:
    get:
      tags: [Models]
      summary: List models
      parameters:
        - { name: active_only, in: query, schema: { type: boolean } }
        - { name: provider, in: query, schema: { type: string } }
      responses:
        '200':
          description: Models list
          content:
            application/json:
              schema:
                type: object
                properties:
                  models: { type: array, items: { $ref: '#/components/schemas/Model' } }
    post:
      tags: [Models]
      summary: Create model
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [provider, model_name]
              properties:
                provider: { type: string }
                model_name: { type: string }
                api_key: { type: string }
                base_url: { type: string }
                notes: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }

  /api/templates:
    get:
      tags: [Templates]
      summary: List templates
      parameters:
        - { name: sort_by, in: query, schema: { type: string, enum: [created, name, run_count] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: Template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: { type: array, items: { $ref: '#/components/schemas/Template' } }
    post:
      tags: [Templates]
      summary: Create template
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }

  /api/personas:
    get:
      tags: [Personas]
      summary: List personas
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [draft, training, trained, incomplete] },
          }
      responses:
        '200':
          description: Persona list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Persona' } }
    post:
      tags: [Personas]
      summary: Create persona
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, task_prompt, task_model_id, judge_model_id, prompt_engineer_model_id]
              properties:
                name: { type: string }
                description: { type: string }
                task_prompt: { type: string }
                initial_judge_prompt: { type: string }
                task_model_id: { type: string }
                judge_model_id: { type: string }
                prompt_engineer_model_id: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Persona' }

  /api/training/validate-models:
    post:
      tags: [Training]
      summary: Validate model separation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [task_model_id, judge_model_id, prompt_engineer_model_id]
              properties:
                task_model_id: { type: string }
                judge_model_id: { type: string }
                prompt_engineer_model_id: { type: string }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid: { type: boolean }
                  errors: { type: array, items: { type: string } }
                  warnings: { type: array, items: { type: string } }
                  models:
                    type: object
                    properties:
                      task: { $ref: '#/components/schemas/SimpleModelInfo' }
                      judge: { $ref: '#/components/schemas/SimpleModelInfo' }
                      promptEngineer: { $ref: '#/components/schemas/SimpleModelInfo' }
    get:
      tags: [Training]
      summary: Get models for validation UI
      parameters:
        - {
            name: action,
            in: query,
            schema: { type: string, enum: [providers, models, suggestions] },
          }
        - { name: provider, in: query, schema: { type: string } }
      responses:
        '200':
          description: Data based on action
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { providers: { type: array, items: { type: string } } }
                  - type: object
                    properties:
                      {
                        models:
                          { type: array, items: { $ref: '#/components/schemas/RawModelInfo' } },
                      }
                  - type: object
                    properties: { suggestions: { type: array, items: { type: object } } }

  /api/playground/run:
    post:
      tags: [Playground]
      summary: Run single-shot evaluation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [personaId, pairId]
              properties:
                personaId: { type: string }
                pairId: { type: string }
                taskPrompt: { type: string }
                judgePrompt: { type: string }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskOutput: { type: string }
                  judgeDecision:
                    type: object
                    properties:
                      rating: { type: string, enum: [pass, fail] }
                      reasoning: { type: string }
                      feedback: { type: string }
                  metadata: { type: object }

  /api/task/generate:
    post:
      tags: [Training]
      summary: Generate task outputs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [persona_id]
              properties:
                persona_id: { type: string }
                task_prompt_text: { type: string }
                training_pair_ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: Generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation_run_id: { type: string }
                  total_pairs: { type: number }
                  results: { type: array, items: { type: object } }

  /api/judge/evaluate:
    post:
      tags: [Training]
      summary: Run judge evaluation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [persona_id]
              properties:
                persona_id: { type: string }
                judge_prompt_text: { type: string }
                training_pair_result_ids: { type: array, items: { type: string } }
                training_pair_ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: Evaluation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation_run_id: { type: string }
                  total_results: { type: number }
                  results: { type: array, items: { type: object } }

  /api/prompts/optimize:
    post:
      tags: [Personas]
      summary: Optimize prompt text
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [prompt_text, prompt_type]
              properties:
                prompt_text: { type: string }
                prompt_type: { type: string, enum: [task, judge] }
                persona_id: { type: string }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggested_prompt: { type: string }
                  rationale: { type: string }
                  improvements: { type: array, items: { type: string } }

  /api/bulk/upload:
    post:
      tags: [Bulk]
      summary: Upload bulk dataset
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset_id: { type: string }
                  filename: { type: string }

  /api/bulk/run:
    post:
      tags: [Bulk]
      summary: Start bulk evaluation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id, system_prompt, model_ids]
              properties:
                dataset_id: { type: string }
                system_prompt: { type: string }
                model_ids: { type: array, items: { type: string } }
                temperature: { type: number }
      responses:
        '201':
          description: Run created
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  status: { type: string }

  /api/bulk/status:
    get:
      tags: [Bulk]
      summary: Get bulk run status
      parameters:
        - { name: run_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  status: { type: string }
                  completion_percentage: { type: number }

  /api/bulk/results:
    get:
      tags: [Bulk]
      summary: Get bulk run results
      parameters:
        - { name: run_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { type: object }
                  rows: { type: array, items: { type: object } }

components:
  schemas:
    RubricType:
      type: string
      enum: [exact_match, partial_credit, semantic_similarity]

    Model:
      type: object
      properties:
        id: { type: string }
        provider: { type: string }
        model_name: { type: string }
        is_active: { type: boolean }
        created_at: { type: string }
        usage_count: { type: number }
        notes: { type: string }

    RawModelInfo:
      type: object
      properties:
        id: { type: string }
        provider: { type: string }
        model_name: { type: string }
        is_active: { type: number, description: '0 or 1' }

    SimpleModelInfo:
      type: object
      properties:
        id: { type: string }
        provider: { type: string }

    Template:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        instruction_text: { type: string }
        model_count: { type: number }
        accuracy_rubric: { $ref: '#/components/schemas/RubricType' }
        created_at: { type: string }
        run_count: { type: number }
        model_ids: { type: array, items: { type: string } }

    TemplateCreateRequest:
      type: object
      required: [name, instruction_text, model_ids, accuracy_rubric]
      properties:
        name: { type: string }
        description: { type: string }
        instruction_text: { type: string }
        model_ids: { type: array, items: { type: string } }
        accuracy_rubric: { $ref: '#/components/schemas/RubricType' }
        expected_output: { type: string }
        partial_credit_concepts: { type: array, items: { type: string } }
        system_prompt: { type: string }
        temperature: { type: number }

    EvaluationListItem:
      type: object
      properties:
        id: { type: string }
        instruction_text: { type: string }
        accuracy_rubric: { $ref: '#/components/schemas/RubricType' }
        created_at: { type: string }
        status: { type: string }
        results_count: { type: number }
        avg_accuracy: { type: number }

    Persona:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        task_model_id: { type: string }
        judge_model_id: { type: string }
        current_iteration: { type: number }
