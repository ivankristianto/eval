        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/training/validate-models:
    post:
      tags: [Training]
      summary: Validate persona model separation
      operationId: validateModelSeparation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSeparationRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSeparationResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Training]
      summary: Get model separation metadata
      operationId: getModelSeparationMetadata
      parameters:
        - name: action
          in: query
          schema:
            type: string
            enum: [providers, models, suggestions]
        - name: provider
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Providers, models, or suggestions
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProviderListResponse'
                  - $ref: '#/components/schemas/ModelsByProviderResponse'
                  - $ref: '#/components/schemas/ModelSuggestionsResponse'
                  - $ref: '#/components/schemas/ModelSeparationMetadataResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DateTime:
      type: string
      format: date-time
    DateTimeOrEmpty:
      description: ISO 8601 timestamp or empty string.
      oneOf:
        - $ref: '#/components/schemas/DateTime'
        - type: string
          enum: ['']

    Provider:
      type: string
      enum: [openai, anthropic, google]

    RubricType:
      type: string
      enum: [exact_match, partial_credit, semantic_similarity]

    EvaluationStatus:
      type: string
      enum: [pending, running, completed, failed]

    ResultStatus:
      type: string
      enum: [pending, completed, failed]

    PersonaStatus:
      type: string
      enum: [draft, training, trained, incomplete]

    IterationStatus:
      type: string
      enum: [in_progress, paused, completed, failed]

    SessionStatus:
      type: string
      enum: [pending, in_progress, paused, completed, failed]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
        field:
          type: string
        details:
          description: Extra error details.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
      additionalProperties: true

    EvaluationCreateRequest:
      type: object
      required: [instruction, model_ids, rubric_type]
      properties:
        instruction:
          type: string
        model_ids:
          type: array
          items:
            type: string
        rubric_type:
          $ref: '#/components/schemas/RubricType'
        expected_output:
          type: string
        partial_credit_concepts:
          type: array
          items:
            type: string
        system_prompt:
          type: string
        temperature:
          type: number

    EvaluationCreateResponse:
      type: object
      required: [evaluation_id, status, models]
      properties:
        evaluation_id:
          type: string
        status:
          $ref: '#/components/schemas/EvaluationStatus'
        models:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationModelStatus'

    EvaluationModelStatus:
      type: object
      required: [model_id, model_name, provider, status]
      properties:
